<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 280" width="1280" height="280" role="img" aria-labelledby="title desc">
  <title id="title">Gutemberg Procópio Barbosa · Creator of Nexus Runtime Platform V2700</title>
  <desc id="desc">Profile banner. Left: the name GUTEMBERG PROCÓPIO BARBOSA, the line "Creator · Nexus Runtime Platform V2700" and the tagline "From vision to engineering. From engineering to evidence." Right: a constellation of connected nodes around a hexagon containing the Nexus N mark, in blue and cyan on a dark background.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="0.55" stop-color="#0F1A2E"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.81" cy="0.5" r="0.3">
      <stop offset="0" stop-color="#2563EB" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E5E7EB"/>
      <stop offset="1" stop-color="#BFDBFE"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="edge" gradientUnits="userSpaceOnUse" x1="880" y1="30" x2="1220" y2="250">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0.85"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#3B82F6" stroke-opacity="0.07" stroke-width="1"/>
      <circle cx="0" cy="0" r="1.2" fill="#22D3EE" fill-opacity="0.12"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="frame">
      <rect width="1280" height="280" rx="20"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <g clip-path="url(#frame)">
    <rect width="1280" height="280" fill="url(#bg)"/>
    <rect width="1280" height="280" fill="url(#grid)"/>
    <rect width="1280" height="280" fill="url(#halo)"/>
    <g fill="none" stroke="#3B82F6" stroke-opacity="0.16" stroke-width="1.5">
      <path d="M0 32H150L174 56H520"/>
      <path d="M0 262H230L250 242H600"/>
      <path d="M1280 20H1200L1180 40H1110"/>
    </g>
    <g fill="#22D3EE" fill-opacity="0.35">
      <circle cx="520" cy="56" r="3"/>
      <circle cx="600" cy="242" r="3"/>
      <circle cx="1110" cy="40" r="3"/>
    </g>
  </g>
  <rect x="0.75" y="0.75" width="1278.5" height="278.5" rx="19.5" fill="none" stroke="#1E3A5F" stroke-width="1.5"/>

  <!-- Accent bar -->
  <rect x="64" y="78" width="6" height="124" rx="3" fill="url(#accent)"/>

  <!-- Name -->
  <text x="92" y="114" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="38" font-weight="800" letter-spacing="2.5" fill="url(#word)">GUTEMBERG PROCÓPIO BARBOSA</text>

  <!-- Role line -->
  <text x="93" y="152" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="1" fill="#3B82F6">Creator <tspan fill="#94A3B8">·</tspan> Nexus Runtime Platform <tspan fill="#22D3EE" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-weight="700">V2700</tspan></text>

  <!-- Tagline -->
  <g font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="20" fill="#E5E7EB">
    <text x="93" y="194">From vision to engineering.</text>
    <text x="93" y="222">From engineering to <tspan fill="#22D3EE" font-weight="600">evidence.</tspan></text>
  </g>

  <!-- Divider -->
  <line x1="840" y1="40" x2="840" y2="240" stroke="#1E3A5F" stroke-width="1.5" stroke-dasharray="2 6"/>

  <!-- Node constellation -->
  <g fill="none" stroke="url(#edge)" stroke-width="2" stroke-linecap="round">
    <line x1="1040" y1="140" x2="902" y2="80"/>
    <line x1="1040" y1="140" x2="920" y2="214"/>
    <line x1="1040" y1="140" x2="1168" y2="66"/>
    <line x1="1040" y1="140" x2="1206" y2="186"/>
    <line x1="1040" y1="140" x2="1088" y2="248"/>
  </g>
  <g fill="none" stroke="#3B82F6" stroke-opacity="0.38" stroke-width="1.5" stroke-dasharray="4 5">
    <line x1="902" y1="80" x2="1020" y2="34"/>
    <line x1="1020" y1="34" x2="1168" y2="66"/>
    <line x1="1168" y1="66" x2="1206" y2="186"/>
    <line x1="1206" y1="186" x2="1088" y2="248"/>
    <line x1="1088" y1="248" x2="920" y2="214"/>
    <line x1="920" y1="214" x2="902" y2="80"/>
    <line x1="1020" y1="34" x2="1040" y2="94"/>
  </g>

  <!-- Peer nodes -->
  <g stroke-width="2.5" fill="#0B1220">
    <circle cx="902" cy="80" r="10" stroke="#3B82F6"/>
    <circle cx="920" cy="214" r="10" stroke="#3B82F6"/>
    <circle cx="1020" cy="34" r="8" stroke="#3B82F6"/>
    <circle cx="1168" cy="66" r="10" stroke="#22D3EE"/>
    <circle cx="1206" cy="186" r="10" stroke="#3B82F6"/>
    <circle cx="1088" cy="248" r="8" stroke="#22D3EE"/>
  </g>
  <g fill="#3B82F6">
    <circle cx="902" cy="80" r="3.5"/>
    <circle cx="920" cy="214" r="3.5"/>
    <circle cx="1020" cy="34" r="3"/>
    <circle cx="1206" cy="186" r="3.5"/>
  </g>
  <g fill="#22D3EE">
    <circle cx="1168" cy="66" r="3.5"/>
    <circle cx="1088" cy="248" r="3"/>
  </g>

  <!-- Nexus mark motif (inline): hexagon with an N of four connected nodes -->
  <polygon points="1040,94 1079.8,117 1079.8,163 1040,186 1000.2,163 1000.2,117" fill="#0B1220" stroke="url(#brand)" stroke-width="3.5" stroke-linejoin="round"/>
  <g filter="url(#glow)">
    <path d="M1022 161V119L1058 161V119" fill="none" stroke="url(#brand)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#0B1220" stroke-width="3">
      <circle cx="1022" cy="161" r="6" stroke="#2563EB"/>
      <circle cx="1022" cy="119" r="6" stroke="#3B82F6"/>
      <circle cx="1058" cy="161" r="6" stroke="#06B6D4"/>
      <circle cx="1058" cy="119" r="6" stroke="#22D3EE"/>
    </g>
    <circle cx="1058" cy="119" r="2.5" fill="#22D3EE"/>
  </g>
</svg>
